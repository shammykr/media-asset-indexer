server:
  port: 8080

spring:
  application:
    name: media-asset-indexer
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  jackson:
    default-property-inclusion: non_null
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      group-id: media-asset-indexer
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.value.default.type: io.github.shammykr.mediaindexer.ingest.AssetEvent
        spring.json.use.type.headers: false
        max.poll.interval.ms: 600000
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        spring.json.add.type.headers: false
    listener:
      ack-mode: record
      concurrency: ${CONSUMER_CONCURRENCY:3}

logging:
  structured:
    format:
      console: ecs
  level:
    root: INFO
    io.github.shammykr.mediaindexer: INFO
    org.apache.kafka: WARN

indexer:
  storage:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:assets}
  topics:
    events: asset-events
    dead-letter: asset-events.DLT
    partitions: 3
  index:
    name: assets
    embedding-dims: 128
  ml:
    # The tagging and embedding stages call this inference endpoint over HTTP.
    # By default it points at the bundled mock model served by this same app (/ml/*).
    base-url: ${ML_BASE_URL:http://localhost:8080}
    timeout: 5s
  pipeline:
    # Asset lifecycle workflows: ordered stages per asset category.
    workflows:
      image: [metadata-extraction, thumbnail, format-conversion, auto-tagging, embedding]
      document: [metadata-extraction, embedding]
      other: [metadata-extraction]
    retry:
      max-attempts: 4
      initial-interval: 500ms
      multiplier: 2.0
      max-interval: 8s
    thumbnail:
      max-size: 256
      quality: 0.8
    conversion:
      source-formats: [png, bmp, gif]
      target-format: jpeg
      quality: 0.85
    tagging:
      min-confidence: 0.3
      max-tags: 10
    document:
      max-content-chars: 20000
